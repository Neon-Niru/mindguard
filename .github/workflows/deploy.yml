name: Test and Deploy

on:
  push:
    branches:
      - main
      - backup-f71dc85
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; a newer push supersedes a queued run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mindguard-backend/requirements.txt

      - name: Install backend dependencies
        working-directory: mindguard-backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: mindguard-backend
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: backend-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mindguard-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mindguard-frontend
        run: npm ci

      - name: Build
        working-directory: mindguard-frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mindguard-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
